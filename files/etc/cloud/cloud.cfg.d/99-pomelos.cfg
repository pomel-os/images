# Pomelos cloud-init configuration for Bazzite disk images.
# @CLOUD_USER@ is substituted at container build time by derive.sh.

# NoCloud first so a locally attached seed ISO wins during manual testing.
datasource_list: [ NoCloud, ConfigDrive, OpenStack, None ]

users:
  - default

system_info:
  default_user:
    name: "@CLOUD_USER@"
    gecos: Pomelos default user
    # No usable password: log in with an SSH key, or set one via user-data.
    lock_passwd: true
    groups: [wheel]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/bash

# No growpart/resize_rootfs: pomelos-growfs.service does both, so it works with
# no datasource. cc_resizefs could not do it anyway -- it hardcodes "/", which on
# bootc is a composefs overlay with no block device behind it.

disable_root: true
ssh_pwauth: false

# Leave network configuration to NetworkManager, which Bazzite already
# configures; cloud-init only needs to write the connection profiles.
